services:
  - type: web
    name: eco-tashkent-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eco-tashkent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  - type: web
    name: eco-tashkent-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
        comment: "API ning public URL (masalan https://eco-tashkent-api.onrender.com) — deploy'dan keyin dashboard'da to'ldiring va rebuild qiling"

  - type: web
    name: eco-tashkent-bot
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_URL
        fromService:
          name: eco-tashkent-api
          type: web
          property: hostport
      - key: WEB_URL
        sync: false
        comment: "Web sayt public URL (masalan https://eco-tashkent-web.onrender.com) — deploy'dan keyin dashboard'da to'ldiring"

databases:
  - name: eco-tashkent-db
    plan: free
