services:
  - type: web
    name: eco-tashkent-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eco-tashkent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  - type: web
    name: eco-tashkent-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: eco-tashkent-api
          type: web
          property: url

  - type: web
    name: eco-tashkent-bot
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_URL
        fromService:
          name: eco-tashkent-api
          type: web
          property: url
      - key: WEB_URL
        fromService:
          name: eco-tashkent-web
          type: web
          property: url

databases:
  - name: eco-tashkent-db
    plan: free
